name: Update curve

on:
  schedule:
    # 13:17 UTC Tue-Sat = 9:17am EDT / 8:17am EST: after the NY Fed publishes SOFR (8am ET)
    # and well after CME's final settlements for the prior trading day.
    - cron: "17 13 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["output/**", "data/**"]

permissions:
  contents: write

concurrency:
  group: curve
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Fetch market data and build curve
        if: github.event_name != 'push'
        run: python build.py

      - name: Commit new curve
        if: github.event_name != 'push'
        run: |
          git config user.name "opensofr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data output
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Curve $(jq -r .as_of output/api/v1/latest.json)"
          git push
