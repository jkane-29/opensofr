name: Update curve

on:
  schedule:
    # 13:17 UTC Tue-Sat = 9:17am EDT / 8:17am EST: after the NY Fed publishes SOFR (8am ET)
    # and well after CME's final settlements for the prior trading day.
    - cron: "17 13 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curve
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt pytest

      - name: Test
        run: python -m pytest -q tests

      - name: Fetch market data and build curve
        if: github.event_name != 'push'
        run: python build.py

      - name: Rebuild site from latest saved inputs
        if: github.event_name == 'push'
        run: python build.py --snapshot "$(ls data/inputs/*.json | sort | tail -1)"

      - name: Commit new data
        if: github.event_name != 'push'
        run: |
          git config user.name "opensofr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/api site/downloads
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Curve $(jq -r .as_of site/api/v1/latest.json)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
